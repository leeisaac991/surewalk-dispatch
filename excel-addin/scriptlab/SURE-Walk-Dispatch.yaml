      const rideIdOf = text => { const ts = parseTs(text[0]); return ts == null ? '' : ts + '|' + (String(text[8] || '').replace(/\D/g, '').slice(-10) || String(text[7] || '').toLowerCase().replace(/[^a-z0-9]/g, '')); };

      /* ---------- names ---------- */
      const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
