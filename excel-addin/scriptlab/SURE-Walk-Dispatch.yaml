        let y, mo, d, h, mi, sec, ap;
        if (m) { [, mo, d, y, h, mi, sec, ap] = m; if (y.length === 2) y = '20' + y; }
        else if ((m = /^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(s))) [, y, mo, d, h, mi, sec] = m;
