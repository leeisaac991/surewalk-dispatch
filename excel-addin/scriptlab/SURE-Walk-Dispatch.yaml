    /* ---- lib/excel.js ---- */
    /*
     * The workbook through Office.js — used when the panel runs as an Excel add-in (inside Excel on the web).
     * Same interface as lib/graph.js, so panel.js works unchanged. No Microsoft app registration needed:
     * the add-in uses the workbook that's open, with the signed-in Excel user's access.
     */
    /* exported G */
    const G = (() => {
      class NeedSignIn extends Error {}
      let wb = null; // { name, sheet }
      const sheetOf = ctx => (wb && wb.sheet ? ctx.workbook.worksheets.getItem(wb.sheet) : ctx.workbook.worksheets.getFirst());

      async function openWorkbook(_link, sheetName) {
        wb = { name: '', sheet: sheetName || '' };
        return Excel.run(async ctx => {
          const ws = sheetOf(ctx);
          ws.load('name'); ctx.workbook.load('name');
          await ctx.sync().catch(e => { throw new Error(e.code === 'ItemNotFound' ? `There's no tab named "${sheetName}" in this workbook.` : e.message); });
          wb = { name: ctx.workbook.name || 'This workbook', sheet: ws.name };
          return { name: wb.name, sheet: wb.sheet };
        });
      }
      function readText(top) {
        return Excel.run(async ctx => {
          const ws = sheetOf(ctx), used = ws.getUsedRangeOrNullObject(true);
          used.load('rowIndex,rowCount');
          await ctx.sync();
          const lastRow = used.isNullObject ? 1 : used.rowIndex + used.rowCount;
          const start = Math.max(2, typeof top === 'function' ? top(lastRow) : top);
          if (lastRow < start) return { lastRow, top: start, text: [] };
          const rg = ws.getRange(`A${start}:W${lastRow}`);
          rg.load('text');
          await ctx.sync();
          return { lastRow, top: start, text: rg.text };
        });
      }
      // One color per row, judged like the old panel: 3+ black cells = black, 3+ red = red, else the most common real color.
      function rowColor(cells) {
        const n = {};
        cells.forEach(c => { c = String(c || '#ffffff').toLowerCase(); n[c] = (n[c] || 0) + 1; });
        const of = kind => Object.keys(n).filter(c => R.rowKind(c).kind === kind && n[c] >= 3).sort((a, b) => n[b] - n[a])[0];
        return of('black') || of('red') || of('color') || '#ffffff';
      }
      function readFills(rows) {
        return Excel.run(async ctx => {
          const ws = sheetOf(ctx);
          const props = rows.map(r => ws.getRange(`A${r}:W${r}`).getCellProperties({ format: { fill: { color: true } } }));
          await ctx.sync();
          const out = {};
          rows.forEach((r, i) => { out[r] = rowColor(props[i].value[0].map(p => p.format.fill.color)); });
          return out;
        });
      }
      function readRows(rows) {
        return Excel.run(async ctx => {
          const ws = sheetOf(ctx);
          const got = rows.map(r => {
            const rg = ws.getRange(`A${r}:W${r}`);
            rg.load('text');
            return { rg, props: rg.getCellProperties({ format: { fill: { color: true }, font: { color: true } } }) };
          });
          await ctx.sync();
          const out = {};
          rows.forEach((r, i) => {
            const cells = got[i].props.value[0];
            out[r] = { text: got[i].rg.text[0], fill: rowColor(cells.map(p => p.format.fill.color)),
              font: String(cells[0].format.font.color || '#000000').toLowerCase() };
          });
          return out;
        });
      }
      // Same ops as lib/graph.js write(): values, clear, whole-row fill, whole-row text color — applied in order.
      function write(ops) {
        if (!ops.length) return Promise.resolve();
        return Excel.run(async ctx => {
          const ws = sheetOf(ctx);
          ops.forEach(op => {
            if (op.t === 'v') ws.getRange(op.addr).values = op.values;
            else if (op.t === 'clr') ws.getRange(op.addr).clear(Excel.ClearApplyTo.contents);
            else if (op.t === 'fill') {
              const rg = ws.getRange(`${op.row}:${op.row}`);
              if (op.color && op.color !== '#ffffff') rg.format.fill.color = op.color; else rg.format.fill.clear();
            } else if (op.t === 'font') ws.getRange(`${op.row}:${op.row}`).format.font.color = op.color || '#000000';
          });
          await ctx.sync();
        });
      }
      const none = async () => { throw new Error('Not needed in the Excel add-in.'); };
      return { configure() {}, openWorkbook, readText, readFills, readRows, write, NeedSignIn,
        signIn: none, signOut: async () => {}, me: async () => ({}), redirectUrl: () => '', get workbook() { return wb; } };
    })();

    /* ---- lib/groupme.js ---- */
    /*
     * GroupMe: post ride messages to the dispatch chat with your own access token (no chat view).
     * Token: web.groupme.com ▸ F12 ▸ Network ▸ any api.groupme.com request ▸ the X-Access-Token header.
     */
    /* exported GM */
    const GM = (() => {
      let base = 'https://api.groupme.com/v3', token = '', groupId = '', members = null, membersAt = 0;
      function configure(c) {
        if (c.base) base = c.base;
        if ('token' in c && c.token !== token) { token = c.token || ''; members = null; }
        if ('groupId' in c && c.groupId !== groupId) { groupId = c.groupId || ''; members = null; }
      }
      const ready = () => !!(token && groupId);
      async function req(method, path, body) {
        if (!token) throw new Error('Add your GroupMe token in Settings.');
        const res = await fetch(base + path, { method, headers: Object.assign({ 'X-Access-Token': token }, body ? { 'Content-Type': 'application/json' } : {}),
          body: body ? JSON.stringify(body) : undefined });
        if (res.status === 401) throw new Error('GroupMe rejected the token — copy a fresh one from web.groupme.com.');
        if (res.status >= 300) throw new Error(`GroupMe returned ${res.status}`);
        const t = await res.text();
        return t ? (JSON.parse(t).response || {}) : {};
      }
      const cleanToken = raw => String(raw || '').replace(/^\s*x-access-token\s*:?\s*/i, '').trim();
      async function check(raw) {
        const t = cleanToken(raw);
        if (!/^[A-Za-z0-9_-]{20,128}$/.test(t)) throw new Error("That doesn't look like a GroupMe token — copy just the value after X-Access-Token.");
        const old = token; token = t;
        try { const me = await req('GET', '/users/me'); return { token: t, name: me.name }; } catch (e) { token = old; throw e; }
      }
      async function groups() { return (await req('GET', '/groups?per_page=100&omit=memberships')).map(g => ({ id: String(g.id), name: g.name })); }
      async function loadMembers() {
        if (members && Date.now() - membersAt < 5 * 60e3) return members;
        const g = await req('GET', `/groups/${groupId}`);
        members = (g.members || []).map(m => ({ id: String(m.user_id), nick: m.nickname || m.name || '', real: m.name || '' }));
        membersAt = Date.now();
        return members;
      }
      // "@Name" for each crew member that matches exactly one chat member by first name (else a plain "@Name").
      async function tagsFor(names) {
        let list = [];
        try { list = await loadMembers(); } catch (e) { /* plain tags */ }
        const first = s => R.norm(String(s).split(/\s+/)[0]);
        return names.filter(Boolean).map(n => {
          const hits = list.filter(m => R.sameName(m.nick, n) || R.sameName(m.real, n));
          const exact = hits.filter(m => first(m.nick) === first(n) || first(m.real) === first(n));
          const m = (exact.length === 1 ? exact : hits.length === 1 ? hits : [])[0];
          return { tag: '@' + (m ? m.nick : n), id: m ? m.id : null };
        });
      }
      /** Posts text with the crew tagged at the end. Returns the message id (for undo). */
      async function post(text, names) {
        if (!ready()) throw new Error('GroupMe is not set up (Settings).');
        const tags = await tagsFor(names || []);
        let full = String(text).trim();
        const loci = [], ids = [];
        if (tags.length) {
          full += '\n';
          tags.forEach((t, i) => {
            if (i) full += ' ';
            if (t.id) { loci.push([full.length, t.tag.length]); ids.push(t.id); }
            full += t.tag;
          });
        }
        if (full.length > 1000) throw new Error('GroupMe messages are limited to 1,000 characters.');
        const message = { source_guid: crypto.randomUUID(), text: full };
        if (ids.length) message.attachments = [{ type: 'mentions', user_ids: ids, loci }];
        const r = await req('POST', `/groups/${groupId}/messages`, { message });
        return r.message ? String(r.message.id) : '';
      }
      async function remove(messageId) {
        if (messageId) await req('DELETE', `/conversations/${groupId}/messages/${messageId}`);
      }
      return { configure, ready, check, groups, post, remove, tagsFor };
    })();

    /* ---- panel.js ---- */
    /*
