name: SURE Walk Dispatch
description: Dispatch panel for the SURE Walk rides sheet (assign, at, picked, cancel, GroupMe posts).
host: EXCEL
api_set: {}
script:
  content: |
    // @ts-nocheck
    // SURE Walk Dispatch — generated by excel-addin/scriptlab.sh from edge-extension/. Edit those files, not this.
    /* ---- lib/office-host.js ---- */
    /*
     * Running as an Excel add-in instead of an Edge extension: the bits of the chrome.* API the panel uses,
     * backed by this browser's localStorage. Loaded before panel.js; panel.js waits for Office to be ready.
     */
    window.SW_HOST = 'excel';
    window.chrome = {
      storage: { local: {
        async get(keys) {
          const out = {};
          [].concat(keys).forEach(k => { try { const v = localStorage.getItem('swd.' + k); if (v != null) out[k] = JSON.parse(v); } catch (e) { /* blocked */ } });
          return out;
        },
        async set(obj) { Object.keys(obj).forEach(k => { try { localStorage.setItem('swd.' + k, JSON.stringify(obj[k])); } catch (e) { /* this session only */ } }); },
        async remove(keys) { [].concat(keys).forEach(k => { try { localStorage.removeItem('swd.' + k); } catch (e) { /* blocked */ } }); },
      } },
      runtime: { getURL: p => p },
      tabs: { create: o => window.open(o.url, '_blank') },
    };
    window.SW_READY = new Promise(resolve => Office.onReady(resolve));

    /* ---- lib/places.js ---- */
    /* Copied unchanged from apps-script/Places.gs (place names, zones, cart rules). Refresh with: ./sync-places.sh */
    /* Browser shims: no geocoder here, so only exact place-name matching is used. */
    function bigGet_() { return null; }
    function bigSet_() {}

    /**
     * Place names: short names, nicknames and common misspellings -> one canonical place.
     * Built from ~4,000 pickups/drop-offs in the live sheet (Sep 30 – Oct 17, 2026).
     * Used for grouping a crew's riders by pickup, the possible-duplicate check, and matching
     * driver messages like "picked kins" / "at sanjac" to a ride.
     *
     * Matching ignores case, punctuation, spaces, apostrophes, zip codes and filler words
     * ("the", "hall", "dorm", "residence", "apartments", "austin", "st"...), so only real
     * nickname/typo variants need listing. Keep look-alike places SEPARATE: e.g. San Jac Garage
     * is not San Jacinto, Littlefield Fountain/House are not Littlefield, Jester West is not Jester (Jester East is).
     */
    const FILE_VERSION_PLACES = '2026-11-07a';

    const PLACES = {
