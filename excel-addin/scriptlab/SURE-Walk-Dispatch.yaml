      const COL = { TS: 1, DISPATCH: 2, CALL: 3, ARRIVE: 4, WAIT: 5, EID: 6, LAST: 7, FIRST: 8, PHONE: 9, PICKUP: 10, DROPOFF: 11,
        ADA: 12, LOC: 13, VAN: 14, DRIVER: 15, NAV: 16, EMAIL: 18, REASON: 22, NOTES: 23 };
